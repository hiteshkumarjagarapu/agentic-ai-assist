services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./.env
    environment:
      # MySQL runs on the host machine; point the URL's host at it from inside the container.
      DB_HOST: host.docker.internal
      CORS_ORIGINS: http://localhost:3000
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["3000:80"]
    depends_on: [backend]
